<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>얼굴 편집 도구</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      gap: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-top: -16px;
    }

    /* 상태 표시 */
    #status-bar {
      background: #1e1e30;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 700px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
    .dot.ready   { background: #34d399; }
    .dot.error   { background: #f87171; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* 효과 선택 */
    .options-panel {
      background: #1e1e30;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 16px 24px;
      width: 100%;
      max-width: 700px;
    }

    .options-panel h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
    }

    .options-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .option-card {
      flex: 1;
      min-width: 180px;
      cursor: pointer;
    }

    .option-card input[type="radio"] { display: none; }

    .option-card label {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 14px;
      border: 2px solid #333;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      background: #15152a;
    }

    .option-card input:checked + label {
      border-color: #7c3aed;
      background: #1e1040;
      box-shadow: 0 0 0 1px #7c3aed44, 0 4px 20px #7c3aed22;
    }

    .option-card label:hover {
      border-color: #555;
      background: #1a1a2e;
    }

    .option-icon { font-size: 2rem; }
    .option-name { font-size: 0.9rem; font-weight: 600; color: #ddd; }
    .option-desc { font-size: 0.75rem; color: #888; text-align: center; }

    /* 드랍존 */
    #drop-zone {
      width: 100%;
      max-width: 700px;
      min-height: 180px;
      border: 2px dashed #444;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
      background: #1e1e30;
      padding: 30px;
      text-align: center;
    }

    #drop-zone.drag-over {
      border-color: #7c3aed;
      background: #1e1040;
      box-shadow: 0 0 30px #7c3aed33;
    }

    #drop-zone.has-image {
      border-style: solid;
      border-color: #34d399;
    }

    .drop-icon { font-size: 3rem; }
    .drop-text { font-size: 1rem; color: #bbb; }
    .drop-sub  { font-size: 0.8rem; color: #666; }

    #file-input { display: none; }

    /* 캔버스 영역 */
    #canvas-wrapper {
      width: 100%;
      max-width: 900px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #canvas-wrapper.visible { display: flex; }

    #canvas {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 40px #00000080;
      display: block;
    }

    /* 버튼 */
    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    #btn-apply {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: #fff;
    }
    #btn-apply:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px #7c3aed66;
    }
    #btn-apply:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #btn-download {
      background: #1e1e30;
      color: #34d399;
      border: 1px solid #34d399;
    }
    #btn-download:hover { background: #0f2e23; }

    #btn-reset {
      background: #1e1e30;
      color: #f87171;
      border: 1px solid #f8717155;
    }
    #btn-reset:hover { background: #2e1515; }

    #result-info {
      font-size: 0.85rem;
      color: #888;
      min-height: 1.2em;
    }

    /* 처리중 오버레이 */
    #processing-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #00000088;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #processing-overlay.visible { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <h1>얼굴 편집 도구</h1>
  <p class="subtitle">클라이언트에서 처리 — 이미지가 서버로 전송되지 않습니다</p>

  <!-- 모델 로딩 상태 -->
  <div id="status-bar">
    <div class="dot loading" id="status-dot"></div>
    <span id="status-text">AI 모델을 불러오는 중...</span>
  </div>

  <!-- 효과 선택 -->
  <div class="options-panel">
    <h2>효과 선택</h2>
    <div class="options-grid">
      <div class="option-card">
        <input type="radio" name="effect" id="eff-eyebar" value="eyebar" checked>
        <label for="eff-eyebar">
          <span class="option-icon">🕶️</span>
          <span class="option-name">눈 검은 선</span>
          <span class="option-desc">눈 위에 검은 선을 그어 신원을 가립니다</span>
        </label>
      </div>
      <div class="option-card">
        <input type="radio" name="effect" id="eff-blur" value="blur">
        <label for="eff-blur">
          <span class="option-icon">🌫️</span>
          <span class="option-name">얼굴 블러</span>
          <span class="option-desc">얼굴 영역만 블러 처리합니다</span>
        </label>
      </div>
      <div class="option-card">
        <input type="radio" name="effect" id="eff-smiley" value="smiley">
        <label for="eff-smiley">
          <span class="option-icon">😊</span>
          <span class="option-name">블러 + 스마일리</span>
          <span class="option-desc">블러 위에 스마일 이모지를 그립니다</span>
        </label>
      </div>
    </div>
  </div>

  <!-- 드래그 앤 드랍 영역 -->
  <div id="drop-zone">
    <span class="drop-icon">🖼️</span>
    <span class="drop-text">이미지를 드래그 앤 드랍하세요</span>
    <span class="drop-sub">또는 클릭하여 파일을 선택하세요 (JPG, PNG, WebP)</span>
    <input type="file" id="file-input" accept="image/*">
  </div>

  <!-- 처리 버튼 -->
  <div class="btn-row">
    <button id="btn-apply" disabled>✨ 효과 적용</button>
    <button id="btn-download" style="display:none">💾 이미지 저장</button>
    <button id="btn-reset" style="display:none">🗑️ 초기화</button>
  </div>

  <span id="result-info"></span>

  <!-- 결과 캔버스 -->
  <div id="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <!-- 처리 중 오버레이 -->
  <div id="processing-overlay">
    <div class="spinner"></div>
    <span style="color:#ddd;font-size:1rem;">얼굴을 감지하는 중...</span>
  </div>

  <script>
    const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';

    // DOM 참조
    const dropZone     = document.getElementById('drop-zone');
    const fileInput    = document.getElementById('file-input');
    const canvas       = document.getElementById('canvas');
    const ctx          = canvas.getContext('2d');
    const btnApply     = document.getElementById('btn-apply');
    const btnDownload  = document.getElementById('btn-download');
    const btnReset     = document.getElementById('btn-reset');
    const statusDot    = document.getElementById('status-dot');
    const statusText   = document.getElementById('status-text');
    const resultInfo   = document.getElementById('result-info');
    const canvasWrapper= document.getElementById('canvas-wrapper');
    const overlay      = document.getElementById('processing-overlay');

    let originalImage  = null; // HTMLImageElement
    let modelsLoaded   = false;

    // ──────────────────────────────────────────
    // 1. 모델 로딩
    // ──────────────────────────────────────────
    async function loadModels() {
      try {
        setStatus('loading', 'AI 모델을 불러오는 중... (최초 1회, 약 3~5 MB)');
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
        ]);
        modelsLoaded = true;
        setStatus('ready', '모델 준비 완료 — 이미지를 올려주세요');
        if (originalImage) btnApply.disabled = false;
      } catch (e) {
        setStatus('error', '모델 로딩 실패: ' + e.message);
        console.error(e);
      }
    }

    function setStatus(state, msg) {
      statusDot.className = 'dot ' + state;
      statusText.textContent = msg;
    }

    loadModels();

    // ──────────────────────────────────────────
    // 2. 드래그 앤 드랍 / 파일 선택
    // ──────────────────────────────────────────
    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) loadImage(file);
    });

    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) loadImage(e.target.files[0]);
    });

    function loadImage(file) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        originalImage = img;
        // 원본 이미지 미리 캔버스에 표시
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
        canvasWrapper.classList.add('visible');
        dropZone.classList.add('has-image');
        resultInfo.textContent = `이미지 크기: ${img.naturalWidth} × ${img.naturalHeight}px`;
        btnApply.disabled  = !modelsLoaded;
        btnDownload.style.display = 'none';
        btnReset.style.display    = 'inline-block';
      };
      img.src = url;
    }

    // ──────────────────────────────────────────
    // 3. 효과 적용
    // ──────────────────────────────────────────
    btnApply.addEventListener('click', applyEffect);

    async function applyEffect() {
      if (!originalImage || !modelsLoaded) return;

      overlay.classList.add('visible');
      btnApply.disabled = true;
      resultInfo.textContent = '';

      try {
        // 원본 다시 그리기
        canvas.width  = originalImage.naturalWidth;
        canvas.height = originalImage.naturalHeight;
        ctx.drawImage(originalImage, 0, 0);

        // 얼굴 감지 + 랜드마크
        const detections = await faceapi
          .detectAllFaces(originalImage, new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.4 }))
          .withFaceLandmarks(true); // true = tiny landmark model

        if (detections.length === 0) {
          resultInfo.textContent = '⚠️ 얼굴을 감지하지 못했습니다. 다른 이미지를 시도해 보세요.';
          btnApply.disabled = false;
          return;
        }

        const effect = document.querySelector('input[name="effect"]:checked').value;

        for (const det of detections) {
          const box       = det.detection.box;
          const landmarks = det.landmarks;

          if (effect === 'eyebar') {
            applyEyeBar(landmarks);
          } else if (effect === 'blur') {
            applyFaceBlur(box);
          } else if (effect === 'smiley') {
            applyFaceBlur(box);
            applySmiley(box);
          }
        }

        resultInfo.textContent = `✅ ${detections.length}개 얼굴에 효과를 적용했습니다`;
        btnDownload.style.display = 'inline-block';

      } catch (e) {
        resultInfo.textContent = '❌ 처리 중 오류: ' + e.message;
        console.error(e);
      } finally {
        overlay.classList.remove('visible');
        btnApply.disabled = false;
      }
    }

    // ──────────────────────────────────────────
    // 효과 구현
    // ──────────────────────────────────────────

    /** 눈 영역에 검은 직사각형 그리기 */
    function applyEyeBar(landmarks) {
      const leftEye  = landmarks.getLeftEye();   // 6개 포인트
      const rightEye = landmarks.getRightEye();  // 6개 포인트

      const allPts = [...leftEye, ...rightEye];
      const xs = allPts.map(p => p.x);
      const ys = allPts.map(p => p.y);

      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);

      const h = maxY - minY;
      const padX = h * 0.8;
      const padY = h * 0.5;

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.roundRect(minX - padX, minY - padY, (maxX - minX) + padX * 2, h + padY * 2, 4);
      ctx.fill();
    }

    /** 얼굴 영역 블러 */
    function applyFaceBlur(box) {
      const { x, y, width, height } = box;

      // 현재 캔버스 스냅샷
      const snap = document.createElement('canvas');
      snap.width  = canvas.width;
      snap.height = canvas.height;
      snap.getContext('2d').drawImage(canvas, 0, 0);

      ctx.save();
      ctx.beginPath();
      // 타원 클리핑으로 얼굴 경계를 자연스럽게
      ctx.ellipse(
        x + width / 2, y + height / 2,
        width / 2, height / 2,
        0, 0, Math.PI * 2
      );
      ctx.clip();

      // blur 필터로 여러 번 그리기 → 강한 블러 효과
      const blurPx = Math.max(width, height) * 0.08;
      ctx.filter = `blur(${blurPx.toFixed(1)}px)`;
      for (let i = 0; i < 6; i++) {
        ctx.drawImage(snap, 0, 0);
      }
      ctx.restore();
    }

    /** 블러된 얼굴 위에 스마일리 */
    function applySmiley(box) {
      const { x, y, width, height } = box;
      const cx = x + width / 2;
      const cy = y + height / 2;
      const r  = Math.min(width, height) * 0.42;
      const lw = Math.max(2, r * 0.06);

      // 노란 얼굴
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.92)';
      ctx.fill();
      ctx.strokeStyle = '#1a1a00';
      ctx.lineWidth = lw;
      ctx.stroke();

      // 왼쪽 눈
      ctx.beginPath();
      ctx.arc(cx - r * 0.3, cy - r * 0.22, r * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a00';
      ctx.fill();

      // 오른쪽 눈
      ctx.beginPath();
      ctx.arc(cx + r * 0.3, cy - r * 0.22, r * 0.1, 0, Math.PI * 2);
      ctx.fill();

      // 웃음 (호)
      ctx.beginPath();
      ctx.arc(cx, cy + r * 0.05, r * 0.38, 0.15, Math.PI - 0.15);
      ctx.strokeStyle = '#1a1a00';
      ctx.lineWidth = lw * 1.2;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // ──────────────────────────────────────────
    // 저장 / 초기화
    // ──────────────────────────────────────────
    btnDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'face-edited.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    btnReset.addEventListener('click', () => {
      originalImage = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvasWrapper.classList.remove('visible');
      dropZone.classList.remove('has-image');
      btnApply.disabled   = true;
      btnDownload.style.display = 'none';
      btnReset.style.display    = 'none';
      resultInfo.textContent    = '';
      fileInput.value           = '';
    });
  </script>
</body>
</html>
